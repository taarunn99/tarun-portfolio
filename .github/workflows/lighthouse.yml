name: Lighthouse (production)

# Runs after CI passes on main, waits until the production site serves that
# commit (Vercel's Git integration does not create GitHub Deployment objects for
# this repo, so deployment_status never fires), then audits the public site.
#
# The gate is PageSpeed Insights: the same Lighthouse on Google's reference
# machines, i.e. what anyone checking the site sees. It needs the PSI_API_KEY
# repository secret (free: https://developers.google.com/speed/docs/insights/v5/get-started).
# Without it, Lighthouse runs on the GitHub runner instead — a shared 2-vCPU VM
# that evaluates JavaScript ~2.5× slower than a reference desktop at the same
# 4× throttling, so its mobile scores read 1–2 points low on any React page.
# That run is informational (reports are uploaded, the job does not fail).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lighthouse-production
  cancel-in-progress: true

env:
  SITE_URL: https://tarun-portfolio-pearl.vercel.app
  SITE_PATHS: /,/work,/work/lapizblue-relaunch,/services/nextjs-development-dubai,/about,/resume,/contact
  HAS_PSI_KEY: ${{ secrets.PSI_API_KEY != '' }}

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Wait for production to serve this commit
        if: github.event_name == 'workflow_run'
        env:
          WANT: ${{ github.event.workflow_run.head_sha }}
        run: |
          for i in $(seq 1 40); do
            got=$(curl -sf "$SITE_URL/version.json?t=$i" | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p')
            echo "attempt $i: live=$got want=$WANT"
            if [ "$got" = "$WANT" ]; then exit 0; fi
            sleep 20
          done
          echo "production never served $WANT" >&2
          exit 1

      - name: Audit production on PageSpeed Insights (gate)
        if: env.HAS_PSI_KEY == 'true'
        run: node scripts/psi.mjs
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
          LH_URL: ${{ env.SITE_URL }}
          LH_PATHS: ${{ env.SITE_PATHS }}

      - name: Audit production on this runner (informational — add PSI_API_KEY to gate)
        if: env.HAS_PSI_KEY != 'true'
        continue-on-error: true
        run: |
          echo "::warning title=No PSI_API_KEY secret::Lighthouse ran on the shared runner; mobile performance reads 1–2 points low here. Add the PSI_API_KEY secret to gate on PageSpeed Insights."
          npm ci
          npm run lighthouse
        env:
          LH_URL: ${{ env.SITE_URL }}
          LH_PATHS: ${{ env.SITE_PATHS }}
          LH_RUNS: 3

      - name: Upload runner reports
        if: always() && env.HAS_PSI_KEY != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-production
          path: reports/
          retention-days: 30
