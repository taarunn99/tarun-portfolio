name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Generates .next/types (PageProps, LayoutProps, route types) on a fresh checkout
      - run: npx next typegen

      - run: npm run typecheck

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      # Lighthouse runs against the live deployment in lighthouse.yml (shared CI
      # runners measure their own CPU, not the site).
