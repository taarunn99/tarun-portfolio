name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Build · Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Generates .next/types (PageProps, LayoutProps, route types) on a fresh checkout
      - run: npx next typegen

      - run: npm run typecheck

      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Lighthouse (mobile + desktop)
        run: npm run lighthouse
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: reports/
          retention-days: 14
